name: Build and Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: List directory
        run: ls -la

      - name: Zip Folder
        run: |
          zip -r ${{ github.event.repository.name }}.zip . \
          -x ".*" ".*/**" ".git/**" ".github/**" ".vscode/**" "node_modules/**" \
          ".gitignore" ".editorconfig" ".distignore" ".phpcs.xml" ".wp-env.json" \
          "composer.json" "composer.lock" "package.json" "package-lock.json" \
          "resources/**" "tests/**" "agent-context/**" "phpunit.xml.dist" \
          "phpunit-integration.xml.dist" "CLAUDE.md"
          ls -la ${{ github.event.repository.name }}.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ github.event.repository.name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
